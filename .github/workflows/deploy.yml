name: Build and Push Docker Images to GHCR

on:
  push:
    branches: [ "main" ]  # Remplace par 'master' si besoin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Étape pour convertir le nom du propriétaire en minuscules
      - name: Set repository owner in lowercase
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      # --- BUILD BACKEND ---
      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./Backend/BudgetTrackerApi
          file: ./Backend/BudgetTrackerApi/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/budgettracker-backend:latest

      # --- BUILD FRONTEND ---
      - name: Build & Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./BudgetTrackerUI
          file: ./BudgetTrackerUI/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.OWNER }}/budgettracker-frontend:latest